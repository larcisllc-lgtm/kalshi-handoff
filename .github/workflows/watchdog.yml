name: watchdog-cron

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos, para adelantarse a las ventanas de lectura de Grok
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar frescura por motor y relanzar el que se quedó atrás
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PY'
          import glob, json, subprocess
          from datetime import datetime, timezone, timedelta

          PT = timezone(timedelta(hours=-7))  # PDT (ajustar a -8 en horario estandar)
          ahora_pt = datetime.now(PT)
          hoy = ahora_pt.strftime("%Y-%m-%d")

          # cada motor escribe su propio archivo fechado (latest.json es compartido y se pisa)
          # ventana_inicio_pt: hora en que EMPIEZA la ventana de lectura de Grok para ese
          # disparo (4am clima: 03:00-05:59; 8am MLB: 07:00-09:59; 12pm MLB: 11:00-13:59).
          # El archivo debe existir y estar fresco YA cuando arranca la ventana, no despues.
          motores = {
              "clima": ("clima.yml", [3]),
              "mlb": ("mlb.yml", [7, 11]),
          }

          for nombre, (workflow, ventanas_inicio_pt) in motores.items():
              # ventanas cuyo inicio ya llego (Grok ya puede estar leyendo)
              abiertas = [h for h in ventanas_inicio_pt
                          if ahora_pt >= ahora_pt.replace(hour=h, minute=0, second=0, microsecond=0)]
              if not abiertas:
                  print(f"{nombre}: aun no abre ninguna ventana de hoy, nada que revisar")
                  continue

              archivo_hoy = f"{hoy}-{nombre}.json"
              archivos = glob.glob(archivo_hoy)

              if not archivos:
                  print(f"{nombre}: NO existe {archivo_hoy} y ya abrio la ventana de las {abiertas[-1]}:00 PT -> disparando {workflow}")
                  subprocess.run(["gh", "workflow", "run", workflow, "--ref", "main"], check=True)
                  continue

              with open(archivo_hoy) as f:
                  data = json.load(f)

              ts = data.get("generado_ts")
              gen = datetime.strptime(ts, "%Y-%m-%dT%H:%M:%S%z")
              gen_pt = gen.astimezone(PT)

              # si el archivo actual es de ANTES de que abriera la ultima ventana vigente,
              # esta desactualizado para esa lectura de Grok -> hay que regenerarlo
              ultima_ventana_dt = ahora_pt.replace(hour=abiertas[-1], minute=0, second=0, microsecond=0)
              if gen_pt < ultima_ventana_dt:
                  print(f"{nombre}: {archivo_hoy} es de {gen_pt.strftime('%H:%M')} PT, anterior a la ventana de las {abiertas[-1]}:00 -> disparando {workflow}")
                  subprocess.run(["gh", "workflow", "run", workflow, "--ref", "main"], check=True)
              else:
                  print(f"{nombre}: OK, {archivo_hoy} generado a las {gen_pt.strftime('%H:%M')} PT, dentro de la ventana vigente")
          PY
